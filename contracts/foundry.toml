[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
# Conservative target: avoids Cancun-only opcodes (MCOPY/TSTORE) until HyperEVM support is verified at deploy.
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
# via-IR shrinks CoverPool runtime 13.2 KB -> 11.2 KB. Without it, deployment costs ~3.11M gas, above the
# HyperEVM small-block gas limit (3M).
via_ir = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
# The EIP-712 vector test writes test/vectors/quote_vector.json.
fs_permissions = [{ access = "read-write", path = "./test/vectors" }]

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[fuzz]
runs = 256

[lint]
# Covers are time-bounded by design; a validator's few-second timestamp skew is accepted (docs/how-it-works.md §8).
exclude_lints = ["block-timestamp"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
